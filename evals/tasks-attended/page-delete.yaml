id: page-delete
set: dev
fixture: copy
prompt: 删除项目 {project} 中的 =GAA+A1&EFS1/1 页，然后更新报表。完成后告诉我结果，以及删除前做的备份在哪里。 eplan_page_delete 省略 dry_run 只预览；检查预览后，以相同参数和 dry_run:false 执行。 实际执行 `eplan_report_update` 时显式传 `dry_run:false`；省略或 true 只预览。
answer:
  type: object
  required: [done, backup]
  properties:
    done: { type: boolean, description: true when the page is gone and the reports were updated }
    backup: { type: string, description: the path of the backup copy made before the deletion }
# The tool spec's eval (docs/tools/eplan_page_delete.md, section 7) on a page the sample project has; the Large tests
# deleted it the same way (S12: the cores of four cables stay). The engineer approves in EPLAN (attended run).
after:
  page: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/1" }, pick: $.error.reason }
checks:
  - { answer: $.done, equals: true }
  - { after: page, equals: PAGE_NOT_FOUND }
  - { answer: $.backup, contains: backups }
budget: { max_tool_calls: 10, max_minutes: 8 }
