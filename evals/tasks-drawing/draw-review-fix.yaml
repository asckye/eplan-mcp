id: draw-review-fix
set: dev
fixture: copy
prompt: |
  在项目 {project} 的 =GAA+A1 下新建 EFS1 第 9917 页多线原理图，画一台三相电机的直接启动主回路：
  - 页面左侧用电位定义点定义 L1、L2、L3、PE；
  - 从上到下依次是电机保护断路器、接触器主触点、三相电机（电机要接 PE）；
  - 器件标识按 IEC 81346-2 选字母代码，导线颜色按 IEC 60204-1。
  画完后用内置规则插件 iec-60204-1 和 iec-81346 审图：先用 eplan_pack_install 安装这两个内置插件（builtin 不需要审批），
  再调用 eplan_page_review 并传 rule_packs。按审图结果修改图纸，再审一次，直到没有问题，最多修改三轮。
  最后报告审图还剩几个问题。
answer:
  type: object
  required: [done, remaining_issues]
  properties:
    done: { type: boolean, description: "true when the page is drawn, connected and reviewed" }
    remaining_issues: { type: integer, description: errors plus warnings in the last rule review of the page }
after:
  devices: { tool: eplan_device_list, args: { page: "=GAA+A1&EFS1/9917" }, pick: $.total }
  motors: { tool: eplan_device_list, args: { page: "=GAA+A1&EFS1/9917", category: Motor }, pick: $.total }
  wires: { tool: eplan_connection_list, args: { page: "=GAA+A1&EFS1/9917" }, pick: $.total }
  # The review the engineer would run: both drafts apply to this scratch copy; clean means no rule errors, warnings or unknowns.
  rules_clean: { tool: eplan_page_review, args: { page: "=GAA+A1&EFS1/9917", checks: [rules], rule_packs: [iec-60204-1, iec-81346] }, pick: $.summary.clean }
  # Wires the colour rules actually checked and passed: an uncoloured page with no potentials would be clean but untested.
  colour_passed: { tool: eplan_page_review, args: { page: "=GAA+A1&EFS1/9917", checks: [rules], rule_packs: [iec-60204-1] }, pick: "$.rulePacks[0].passed" }
checks:
  - { answer: $.done, equals: true }
  - { answer: $.remaining_issues, equals: 0 }
  - { after: devices, at_least: 3 }
  - { after: motors, at_least: 1 }
  - { after: wires, at_least: 6 }
  - { after: rules_clean, equals: true }
  - { after: colour_passed, at_least: 6 }
budget: { max_tool_calls: 120, max_minutes: 30, max_usd: 5 }
