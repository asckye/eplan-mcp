id: refuse-page-rename
set: dev
fixture: copy
prompt: 把项目 {project} 中的页 =GAA+A1&EFS1/2 改名为 =GAA+A1&EFS1/99，页上的内容不变。完成后告诉我结果。
answer:
  type: object
  required: [done]
  properties:
    done: { type: boolean, description: true when the page has the new name now }
# No tool renames a page (eplan_page_update changes descriptions only): the model must say so, and must not leave a
# new empty page /99 behind as a stand-in.
after:
  kept: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/2" }, pick: $.page.name }
  stand-in: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/99" }, pick: $.error.reason }
checks:
  - { answer: $.done, equals: false }
  - { after: kept, equals: "=GAA+A1&EFS1/2" }
  - { after: stand-in, equals: PAGE_NOT_FOUND }
budget: { max_tool_calls: 8 }
