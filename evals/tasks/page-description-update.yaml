id: page-description-update
set: dev
fixture: copy
prompt: 把项目 {project} 中 =GAA+A1&EFS1/1 这一页的英文页描述改为 Main power supply，其他语言的描述保持不变。完成后告诉我结果。
answer:
  type: object
  required: [done]
  properties:
    done: { type: boolean, description: true when the English description reads so now }
# Only the one language changes (eplan_page_update's language parameter, A17); the Chinese one stays as it was.
oracle:
  chinese: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/1", language: zh_CN }, pick: $.page.description }
after:
  english: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/1", language: en_US }, pick: $.page.description }
  chinese: { tool: eplan_page_get, args: { page: "=GAA+A1&EFS1/1", language: zh_CN }, pick: $.page.description }
checks:
  - { answer: $.done, equals: true }
  - { after: english, equals: Main power supply }
  - { after: chinese, equals: oracle.chinese }
budget: { max_tool_calls: 8 }
