name: commit-rules

# Enforces docs/process/development-workflow.md section 5:
# Conventional Commits PR titles and no AI attribution in titles, descriptions or commits.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR title and description
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          bash eng/scripts/check-commit-message.sh --subject "$RUNNER_TEMP/title.txt"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          bash eng/scripts/check-commit-message.sh "$RUNNER_TEMP/body.txt"

      - name: Every commit in the PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg.txt"
            if ! bash eng/scripts/check-commit-message.sh "$RUNNER_TEMP/msg.txt"; then
              echo "::error::commit $sha violates the commit rules"
              status=1
            fi
          done
          exit "$status"
