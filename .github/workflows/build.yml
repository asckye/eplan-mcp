name: build

# CI gates of docs/process/development-workflow.md section 7 that need no EPLAN: build with warnings as errors,
# format check, and Small + Medium tests. eng/scripts/local-gate.ps1 runs the same steps before a push to main; on
# main this workflow is a non-blocking check. The add-in (EplanMcp.Bridge.Eplan) compiles against the EPLAN API and
# is built only on machines with EPLAN, so CI uses the EplanMcp.Ci.slnf filter.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # A hung test once held a run for an hour (2026-10-20); the test step below stops itself sooner.
    timeout-minutes: 40
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # CI=true (set by GitHub) turns on locked-mode restore (Directory.Build.props).
      - name: Restore
        run: dotnet restore EplanMcp.Ci.slnf

      - name: Build
        run: dotnet build EplanMcp.Ci.slnf -c Release --no-restore

      - name: Format
        run: dotnet format EplanMcp.Ci.slnf --verify-no-changes --no-restore

      # The action catalog (catalog/) and the table it comes from (docs/eplan/api-actions.md) must agree: schema, ids, rows, counts.
      - name: Action catalog
        shell: pwsh
        run: eng/scripts/check-action-catalog.ps1

      # The committed EPLAN API coverage files must match their inputs (catalog/README.md). A Bridge scan older than the
      # Bridge sources is only a warning: rescanning needs a machine with EPLAN installed.
      - name: Coverage files
        run: dotnet run --project eng/coverage -c Release --no-build -- check

      # --timeout ends the whole test session after 20 minutes instead of holding the runner. A test still running after
      # two minutes is written to hung-tests-<assembly>.txt in the results (tests/Shared/HangWatch.cs), and the report
      # step below names it; xUnit's --long-running report does not reach the dotnet test output.
      - name: Small and Medium tests
        id: tests
        env:
          EPLANMCP_HANG_REPORT_DIR: ${{ runner.temp }}/test-results
        run: dotnet test --solution EplanMcp.Ci.slnf -c Release --no-build -- --filter-not-trait "Size=Large" --timeout 20m --report-xunit-trx --results-directory "${{ runner.temp }}/test-results"

      # A wrong filter or a broken discovery passes with few or no tests run: every test assembly must pass at least
      # its floor in tests/test-suites.json, and every assembly that ran must be listed there (testing.md section 7).
      - name: Test count floor
        shell: pwsh
        run: eng/scripts/check-test-floor.ps1 -ResultsDirectory "$env:RUNNER_TEMP/test-results"

      # Job logs need a GitHub sign-in, annotations do not: repeat each failed test as an annotation.
      - name: Report failed tests
        if: failure() && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          function Escape([string]$text, [switch]$property) {
            $text = $text -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            if ($property) { $text = $text -replace ':', '%3A' -replace ',', '%2C' }
            $text
          }
          $failed = 0
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/test-results" -Filter *.trx -ErrorAction SilentlyContinue) {
            [xml]$trx = Get-Content $file.FullName -Raw
            foreach ($result in @($trx.TestRun.Results.UnitTestResult) | Where-Object { $_ -and $_.outcome -notin 'Passed', 'NotExecuted' }) {
              $failed++
              $text = "$($result.outcome): $($result.Output.ErrorInfo.Message)`n$($result.Output.ErrorInfo.StackTrace)".Trim()
              if ($text.Length -gt 4000) { $text = $text.Substring(0, 4000) + ' ...' }
              Write-Output "::error title=$(Escape $result.testName -property)::$(Escape $text)"
            }
          }
          foreach ($file in Get-ChildItem "$env:RUNNER_TEMP/test-results" -Filter hung-tests-*.txt -ErrorAction SilentlyContinue) {
            foreach ($line in Get-Content $file.FullName) {
              $failed++
              Write-Output "::error title=Hung test::$(Escape $line)"
            }
          }
          if ($failed -eq 0) { Write-Output '::error::No failed test in the TRX files; a test host may have crashed or not started.' }

      # Fails on high or critical advisories, direct or transitive (development-workflow section 7).
      - name: Vulnerable packages
        shell: pwsh
        run: |
          $data = dotnet list EplanMcp.Ci.slnf package --vulnerable --include-transitive --format json | Out-String | ConvertFrom-Json
          $found = @($data.projects | ForEach-Object { $_.frameworks } |
            ForEach-Object { @($_.topLevelPackages) + @($_.transitivePackages) } | Where-Object { $_ } |
            ForEach-Object { $package = $_; $_.vulnerabilities | Where-Object { $_.severity -in 'High', 'Critical' } |
              ForEach-Object { "$($package.id) $($package.resolvedVersion): $($_.severity) $($_.advisoryurl)" } })
          $found | ForEach-Object { Write-Output "::error::$_" }
          if ($found.Count -gt 0) { exit 1 }
