name: 工具需求
description: 希望 AI 能通过本项目在 EPLAN 中完成的新任务
labels: ["type/feature", "area/tools", "needs-triage"]
body:
  - type: textarea
    id: task
    attributes:
      label: 任务场景
      description: 用工程师的话描述要完成的工作，而不是要哪个 API。例如"根据 Excel 里的 IO 表生成 PLC 卡片页"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: 现在在 EPLAN 里怎么做
      description: 手工操作步骤、用到的菜单或功能，有截图更好
  - type: dropdown
    id: risk
    attributes:
      label: 是否会修改项目
      options: ["只读", "会修改项目", "会删除数据", "不确定"]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 怎样算完成
      description: 可检验的验收标准
