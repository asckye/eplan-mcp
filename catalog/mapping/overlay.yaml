# tools: what a tool's code cannot say about it: a note, and Bridge operations it reaches outside its own code.
tools:
  eplan_project_create:
    operations: [project.create.plan, project.create.execute, project.restore.plan, project.restore.execute]
    note: Host 只接受不存在的目标；Bridge 执行内创建目录、检查兼容性并负责清理。尚未运行工具 Large 验收。
  eplan_part_import: { note: 写流水线在审批之后调用 masterdata.backup 备份部件库（ADR-0019，规格第 5 节）, operations: [masterdata.backup] }
  eplan_part_sync: { note: 写流水线在审批之后调用 masterdata.backup 备份部件库（ADR-0019，规格第 5 节）, operations: [masterdata.backup] }
  eplan_session_status: { note: 只在 Host 中运行：读 Bridge 的握手，不调用 Bridge 操作 }
  eplan_session_select: { note: 只在 Host 中运行：在已发现的 EPLAN 实例中选一个，不调用 Bridge 操作 }
  eplan_tool_usage: { note: 只在 Host 中运行：返回工具用法文本，不接触 EPLAN }

# api: catalog entries the generator must not count as plain gaps. match: N:<namespace> (and its sub-namespaces),
# T:<type> or a member ID. status: excluded (left out of the denominator) with a reason of the design's set (gui,
# internal, deprecated, unsafe, not_applicable; docs/design/2026-10-21-api-capability-coverage.md section 4) and a
# note | env_blocked (kept in the denominator) with its condition | partial with a note.
api:
  # The owner's decision Q3 of 2026-10-21: Remote client and server (253 groups), Gui (72) and Scripting (3).
  - { match: "N:Eplan.EplApi.RemoteClient", status: excluded, reason: not_applicable, note: 远程客户端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.RemoteServer", status: excluded, reason: not_applicable, note: 远程客户端的服务端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Remoting", status: excluded, reason: not_applicable, note: 远程调用，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.GrpcServer", status: excluded, reason: not_applicable, note: 远程客户端的 gRPC 服务端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Gui", status: excluded, reason: gui, note: 需要人在界面上操作；第七阶段设计交互接入时逐项复审, source: 负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Scripting", status: excluded, reason: unsafe, note: 脚本属于 Code 级，默认关闭, source: ADR-0005；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.DataModel.Planning", status: env_blocked, condition: 开发机授权中 Preplanning 不可用, source: api-notes A24 }

# availability: where the coverage was established, per version, module and licence.
availability:
  - { scope: EPLAN 2026.0.3.25421, status: verified, note: 写明版本的实机记录都在这个版本上；没有其他版本的记录, source: api-notes A10–A30 }
  - { scope: Electric P8, status: verified, note: 大部分实机记录所用的变体, source: api-notes A12–A30 }
  - { scope: Pro Panel, status: verified, note: 只验证过会话与项目列表（M1）, source: api-notes A10 }
  - { scope: "N:Eplan.EplApi.DataModel.Planning", status: env_blocked, note: Preplanning 授权不可用，预规划 API 无法验证, source: api-notes A24 }
  - { scope: "N:Eplan.EplApi.DataModel.E3D", status: unverified, note: 授权中有 ProPanelProfessional，但 E3D API 没有实机验证过, source: api-notes A2 }
