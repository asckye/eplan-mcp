# Coverage facts the code cannot show, maintained by hand: live verification of tools, notes, exclusions and
# environment blocks, and availability per version, module and licence. Every entry names its source in this
# repository; nothing is copied from the official documentation. `dotnet run --project eng/coverage -- generate`
# reads it; CI fails when the generated files no longer match it.
#
# live: per tool, the runs against a real EPLAN recorded in api-notes, a tool spec or the Large test README.
#   result: pass | pass_with_findings | partial | fail
#   basis:  stated   - the source names the tool;
