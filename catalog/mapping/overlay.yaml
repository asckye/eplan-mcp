# tools: what a tool's code cannot say about it: a note, and Bridge operations it reaches outside its own code.
tools:
  eplan_annotation_create:
    operations: [project.get, page.get, page.drawing.get, placement.text.create.plan, placement.text.create.execute]
    note: 复用 PlacementCreateTools 和 PlacementCreatePlanning 的规划与写入链路；A97 原生创建已验，工具整批 LargeWrite 待验。
  eplan_plan_get: { note: P12 仅查询 Host 计划快照；同会话归属、分页、片段、预算和只读 Resource，不访问 Bridge；stateless HTTP 拒绝。 }
  eplan_workflow_plan: { note: P11 双读之间编译并审计后发布；返回计划链接，Resource 已由 P12 注册。Large 已编写、未实跑。, operations: [project.snapshot, device.list, plan.functions, plan.macro.inspect, page.create.plan, page.update.plan, device.update.plan, macro.insert.plan, page.delete.plan, page.renumber.plan, device.renumber.plan] }
  eplan_rule_check: { note: R5 柜内正式规则四值查询；修复仅编译计划，unknown 或范围冲突拒绝。未运行实机。, operations: [plan.names, project.snapshot, plan.functions, plan.macro.inspect, page.create.plan, page.update.plan, device.update.plan, macro.insert.plan, page.delete.plan, page.renumber.plan, device.renumber.plan] }
  eplan_context_get: { note: P24 通过 PlanBaselineReader 每次读取新快照；只读包索引与真实绑定，不运行规则。Large 待实跑。, operations: [project.snapshot] }
  eplan_project_create:
    operations: [project.create.plan, project.create.execute, project.restore.plan, project.restore.execute]
    note: Host 只接受不存在的目标；Bridge 执行内创建目录、检查兼容性并负责清理。尚未运行工具 Large 验收。
  eplan_part_import: { note: 写流水线在审批之后调用 masterdata.backup 备份部件库（ADR-0019，规格第 5 节）, operations: [masterdata.backup] }
  eplan_part_sync: { note: 写流水线在审批之后调用 masterdata.backup 备份部件库（ADR-0019，规格第 5 节）, operations: [masterdata.backup] }
  eplan_translation_import: { note: language 分组；写流水线每次审批后先备份翻译库（.zw7）。Large 须负责人逐次批准后运行，2026-10-27 通过。, operations: [masterdata.backup] }
  eplan_session_status: { note: 只在 Host 中运行：读 Bridge 的握手，不调用 Bridge 操作 }
  eplan_session_select: { note: 只在 Host 中运行：在已发现的 EPLAN 实例中选一个，不调用 Bridge 操作 }
  eplan_tool_usage: { note: 只在 Host 中运行：返回工具用法文本，不接触 EPLAN }

# api: catalog entries the generator must not count as plain gaps. match: N:<namespace> (and its sub-namespaces),
# T:<type> or a member ID. status: excluded (left out of the denominator) with a reason of the design's set (gui,
# internal, deprecated, unsafe, not_applicable; docs/design/2026-10-21-api-capability-coverage.md section 4) and a
# note | env_blocked (kept in the denominator) with its condition | partial with a note.
api:
  - { match: "O:Eplan.EplApi.DataModel.Function.UpdateLocalTemplate", status: refused, sides: [write], reason: unsafe, note: 实机试执行使 EPLAN 崩溃（0xe0434352）, source: api-notes A77 }
  - { match: "O:Eplan.EplApi.DataModel.MacroBox.RepresentationType", status: refused, sides: [write], reason: unsafe, note: 实机试执行使 EPLAN 崩溃（0xc0000409）, source: api-notes A77 }
  - { match: "O:Eplan.EplApi.DataModel.Page.ConvertToGraphics", status: refused, sides: [write], reason: unsafe, note: 实机试执行使 EPLAN 崩溃（0xc0000409）, source: api-notes A77 }
  - { match: "O:Eplan.EplApi.DataModel.Project.ProjectName", status: refused, sides: [write], reason: unsafe, note: 实机试执行在磁盘上给打开的项目改名，撤销不恢复，之后按原名找不到项目, source: api-notes A77 }
  - { match: "O:Eplan.EplApi.DataModel.E3D.BusBar.BarDistance", status: refused, sides: [read], reason: unsafe, note: 实机批量读取时 EPLAN 崩溃（0xc0000409）, source: api-notes A77 }
  # The owner's decision Q3 of 2026-10-21: Remote client and server (253 groups), Gui (72) and Scripting (3).
  - { match: "N:Eplan.EplApi.RemoteClient", status: excluded, reason: not_applicable, note: 远程客户端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.RemoteServer", status: excluded, reason: not_applicable, note: 远程客户端的服务端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Remoting", status: excluded, reason: not_applicable, note: 远程调用，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.GrpcServer", status: excluded, reason: not_applicable, note: 远程客户端的 gRPC 服务端，架构上不采用, source: ADR-0002；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Gui", status: excluded, reason: gui, note: 需要人在界面上操作；第七阶段设计交互接入时逐项复审, source: 负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.Scripting", status: excluded, reason: unsafe, note: 脚本属于 Code 级，默认关闭, source: ADR-0005；负责人决定 Q3（2026-10-21） }
  - { match: "N:Eplan.EplApi.DataModel.Planning", status: env_blocked, condition: 开发机授权中 Preplanning 不可用, source: api-notes A24 }

# reached-by-tool：人工核对的可执行别名；每条仅覆盖 members 中的读取重载。
# source 是打开父值必经的按 ID 读取，receiver 是工具取得具体列表的代码。
# SDK 2026.0.3.25421 中此 getter 与 via 的同签名 getter 共用 RVA；不推定索引重载、枚举 ID 或 setter。
# eplan_property_get 仅接受 page/function/connection 定位器及项目；其余列表只记 eplan_object_get。
# 逐组取舍、SDK 元数据核对方法和未计入项见 docs/eplan/operation-mapping-review.md。
reached-by-tool:
  - { match: "O:Eplan.EplApi.DataModel.ArticlePropertyList.Property", members: ["P:Eplan.EplApi.DataModel.ArticlePropertyList.Property(Eplan.EplApi.DataModel.AnyPropertyId)"], tools: [eplan_object_get], via: "O:Eplan.EplApi.DataModel.UniversalPropertyList.Property", source: src/EplanMcp.Bridge.Eplan/Adapters/EplanPropertyReadAdapter.cs:160, receiver: src/EplanMcp.Bridge.Eplan/Adapters/ObjectKindDispatch.g.cs:258 }
  - { match: "O:Eplan.EplApi.DataModel.BlockPropertyList.Property", members: ["P:Eplan.EplApi.DataModel.BlockPropertyList.Property(Eplan.EplApi.DataModel.AnyPropertyId)"], tools: [eplan_object_get], via: "O:Eplan.EplApi.DataModel.UniversalPropertyList.Property", source: src/EplanMcp.Bridge.Eplan/Adapters/EplanPropertyReadAdapter.cs:160, receiver: src/EplanMcp.Bridge.Eplan/Adapters/ObjectKindDispatch.g.cs:261 }
  - { match: "O:Eplan.EplApi.DataModel.ConnectionDefinitionPointPropertyList.Property", members: ["P:Eplan.EplApi.DataModel.ConnectionDefinitionPointPropertyList.Property(Eplan.EplApi.DataModel.AnyPropertyId)"], tools: [eplan_object_get], via: "O:Eplan.EplApi.DataModel.UniversalPropertyList.Property", source: src/EplanMcp.Bridge.Eplan/Adapters/EplanPropertyReadAdapter.cs:160, receiver: src/EplanMcp.Bridge.Eplan/Adapters/ObjectKindDispatch.g.cs:276 }
